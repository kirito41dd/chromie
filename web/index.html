<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chromie · 记忆空间</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f7f7fc;color:#252542;font-family:system-ui,sans-serif}
    /* JS 固定容器的像素尺寸，防止拖动时画布持续变化；百分比只跟随容器。 */
    #viewport{position:fixed;top:0;left:0;width:100vw;height:100vh}
    #canvas{display:block;width:100%!important;height:100%!important;outline:none}
    #canvas[data-reading-pointer="true"][style*="cursor: text"]{cursor:default!important}
    #loading{visibility:hidden;animation:show-loading 0s 180ms forwards;position:absolute;inset:0;display:grid;place-content:center;text-align:center;gap:12px}
    @keyframes show-loading{to{visibility:visible}}
    #loading strong{font-size:26px;font-weight:600;letter-spacing:1px;color:#6d5ef7}
    #loading span{font-size:14px;color:#5c5d78}
    #loading[hidden]{display:none}
  </style>
</head>
<body>
  <div id="viewport"><canvas id="canvas" aria-label="Chromie 记忆看板"></canvas></div>
  <div id="loading"><strong>Chromie</strong><span id="loading-message">正在打开记忆空间…</span></div>
  <script type="module" src="/web/bootstrap.js"></script>
</body>
</html>
